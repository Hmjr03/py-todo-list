{% extends "todo/base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center mt-5">
        <div class="card shadow-sm border-danger border-2">
            <div class="card-body p-5">
                <h1 class="display-1 text-danger">⚠️</h1>
                <h3 class="fw-bold text-dark mt-3">Atenção!</h3>
                <p class="text-muted">Você tem certeza que deseja excluir este item permanentemente?</p>
                <form method="post" class="mt-4">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <a href="javascript:history.back()" class="btn btn-outline-secondary px-4">Cancelar</a>
                        <button type="submit" class="btn btn-danger px-4">Sim, Excluir</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
