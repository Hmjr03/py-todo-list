{% extends "base.html" %}

{% block title %}
    Delete task
{% endblock %}


{% block content %}

<div class="form-container">

    <h1>
        Delete task
    </h1>


    <p>
        Are you sure you want to delete
        "<strong>{{ object.content }}</strong>"?
    </p>


    <form method="post">

        {% csrf_token %}

        <button
            type="submit"
            class="button button-danger"
        >
            Yes, delete
        </button>


        <a
            href="{% url 'task-list' %}"
            class="button button-secondary"
        >
            Cancel
        </a>

    </form>

</div>

{% endblock %}
