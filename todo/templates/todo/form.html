{% extends "todo/base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 mt-5">
            <div class="card-body p-5">
                <h2 class="fw-bold mb-4">Salvar Dados</h2>
                <form method="post">
                    {% csrf_token %}
                    <!-- O Django renderiza os campos aqui -->
                    <div class="mb-4">
                        {{ form.as_p }}
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg fw-bold">Save</button>
                        <a href="javascript:history.back()" class="btn btn-light">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
