{% extends "base.html" %}

{% block title %}

    {% if object %}
        Update tag
    {% else %}
        Add tag
    {% endif %}

{% endblock %}


{% block content %}

<div class="form-container">

    <h1>

        {% if object %}
            Update tag
        {% else %}
            Add tag
        {% endif %}

    </h1>


    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}


        <div class="form-actions">

            <button
                type="submit"
                class="button"
            >
                Save
            </button>


            <a
                href="{% url 'tag-list' %}"
                class="button button-secondary"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
