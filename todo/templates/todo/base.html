<!DOCTYPE html>
<html lang="pt-br">
<head>

    <title>Lista de Tarefas Profissional</title>
    <!-- Importando o Bootstrap 5 via CDN -->

</head>
<body class="bg-light">
    <div class="container-fluid">
        <div class="row vh-100">

                <h4 class="text-primary mb-4">Painel</h4>
                <ul class="nav flex-column gap-2">
                    <li class="nav-item">
                        <a class="nav-link btn btn-light text-start fw-bold" href="{% url 'task-list' %}">🏠 Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link btn btn-light text-start fw-bold" href="{% url 'tag-list' %}">🏷️ Tags</a>
                    </li>
                </ul>
            </nav>

            <!-- Conteúdo Principal -->
            <main class="col-md-10 p-5">
                {% block content %}
                {% endblock %}
            </main>
        </div>
    </div>
</body>
</html>
